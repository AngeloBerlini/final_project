{% extends "base.html" %}
{% block title %}Login – PIT WALL{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <h1>Login</h1>
  <div class="card">
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Accedi</button>
    </form>
  </div>
  <p class="auth-link">
    Non hai un account? <a href="{{ url_for('auth.register') }}">Registrati</a>
  </p>
  <p class="auth-link">
    <a href="{{ url_for('circuits.list') }}">Sfoglia i circuiti senza accedere &rarr;</a>
  </p>
</div>
{% endblock %}
