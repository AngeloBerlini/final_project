{% extends "base.html" %}
{% block title %}{% if post %}Modifica analisi{% else %}Nuova analisi{% endif %} – PIT WALL{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{% if post %}Modifica analisi{% else %}Nuova analisi{% endif %}</h1>
</div>

<div class="card">
  <form method="POST"
        action="{{ url_for('posts.edit', post_id=post.id) if post else url_for('posts.create') }}"
        enctype="multipart/form-data">
    <div class="form-row">
      <div class="form-group">
        <label for="title">Titolo</label>
        <input type="text" id="title" name="title"
               value="{{ post.title if post else '' }}" required
               placeholder="es. Monaco – Analisi degrado gomme">
      </div>
      <div class="form-group">
        <label for="circuit_id">Circuito</label>
        <select id="circuit_id" name="circuit_id" required>
          {% for c in circuits %}
          <option value="{{ c.id }}" {% if post and post.circuit_id == c.id %}selected{% endif %}>
            {{ c.name }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="body">Contenuto</label>
      <textarea id="body" name="body" required
                placeholder="Scrivi la tua analisi tecnica...">{{ post.body if post else '' }}</textarea>
    </div>

    {% if not post %}
    <div class="form-group">
      <label for="media">Allega file <span class="field-hint-inline">PNG, JPG, PDF, CSV – max 10 MB</span></label>
      <input type="file" id="media" name="media" multiple accept=".png,.jpg,.jpeg,.pdf,.csv">
    </div>
    {% endif %}

    <div class="actions">
      <button type="submit" class="btn btn-primary">
        {% if post %}Aggiorna{% else %}Pubblica{% endif %}
      </button>
      <a href="{{ url_for('posts.detail', post_id=post.id) if post else url_for('hub.index') }}"
         class="btn btn-secondary">Annulla</a>
    </div>
  </form>
</div>
{% endblock %}
